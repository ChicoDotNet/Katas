name: Ruby unusual spending kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000006/**'
      - '.github/workflows/ruby-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000006/**'
      - '.github/workflows/ruby-katas.yml'
permissions:
  contents: read
jobs:
  spending:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: RED GREEN and independent oracle
        working-directory: katas/KATA-000006
        shell: bash
        run: |
          set -euo pipefail
          ruby -I src tests/test_spending.rb
          python3 tests/differential.py src/cli.rb
          if KATA_RED=1 ruby -I src tests/test_spending.rb > /tmp/spending-red.log 2>&1; then
            echo 'RED unexpectedly passed' >&2; exit 1
          fi
          grep -q 'Failure:' /tmp/spending-red.log
