name: Branch governance

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  topology:
    name: Validate branch topology
    runs-on: ubuntu-24.04
    steps:
      - name: Check allowed source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" == main ]]; then
            if [[ "$HEAD_REF" == dev ]] || [[ "$ACTOR" == 'dependabot[bot]' && "$HEAD_REF" == dependabot/* ]]; then
              echo "Approved promotion or Dependabot update into main."
              exit 0
            fi
            echo "::error::Only dev promotions or Dependabot updates may target main."
            exit 1
          fi
          if [[ "$BASE_REF" == dev ]]; then
            if [[ "$HEAD_REF" == main ]]; then
              echo "Ancestry-sync PR: content-neutral gate runs separately."
              exit 0
            fi
            case "$HEAD_REF" in
              features/*|bugs/*|releases/*|hotfixes/*|tags/*|kata/*|feature/*|chore/*|docs/*|dependabot/*)
                echo "Approved working branch into dev."
                exit 0
                ;;
            esac
          fi
          echo "::error::Unsupported branch flow: $HEAD_REF -> $BASE_REF"
          exit 1

  content-neutral-sync:
    name: main-to-dev sync changes no content
    if: github.base_ref == 'dev' && github.head_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.ref }}
      - name: Verify merge ancestry and no tree delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          git diff --exit-code HEAD^1 HEAD -- .
          echo "Content-neutral sync certified for base $BASE_SHA."
