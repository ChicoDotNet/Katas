name: Swift String Calculator + Go AST-first oracle
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000025/**'
      - '.github/workflows/swift-string-calculator-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000025/**'
      - '.github/workflows/swift-string-calculator-kata.yml'
permissions:
  contents: read
jobs:
  calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: Native RED GREEN, AST-first differential, and compiled mutations
        working-directory: katas/KATA-000025
        shell: bash
        run: |
          set -euo pipefail
          swiftc --version
          go version
          bash tests/run.sh
