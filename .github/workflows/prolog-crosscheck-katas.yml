name: Prolog relational models — Dominoes and Connect Hex
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000044/**'
      - 'katas/KATA-000048/**'
      - 'tools/test_prolog_kata.mjs'
      - '.github/workflows/prolog-crosscheck-katas.yml'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000044/**'
      - 'katas/KATA-000048/**'
      - 'tools/test_prolog_kata.mjs'
      - '.github/workflows/prolog-crosscheck-katas.yml'
permissions:
  contents: read
jobs:
  prolog-graph-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog-nox
      - name: Compile original solvers
        run: |
          cd katas/KATA-000044 && go build -o /tmp/ninja-dominoes-cli ./cmd/dominoes
          cd ../KATA-000048 && c++ -std=c++20 -Wall -Wextra -Werror -pedantic src/connect.cpp src/main.cpp -o /tmp/ninja-connect-cli
      - name: Independent Prolog Euler graph characterization
        run: node tools/test_prolog_kata.mjs dominoes katas/KATA-000044/tests/prolog_cycle.pl /tmp/ninja-dominoes-cli
      - name: Independent Prolog relational Hex traversal
        run: node tools/test_prolog_kata.mjs connect katas/KATA-000048/tests/prolog_connect.pl /tmp/ninja-connect-cli
