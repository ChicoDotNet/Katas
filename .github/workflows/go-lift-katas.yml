name: Go Lift kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000028/**'
      - '.github/workflows/go-lift-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000028/**'
      - '.github/workflows/go-lift-katas.yml'
permissions:
  contents: read
jobs:
  lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.2'
      - name: RED GREEN and independent oracle
        working-directory: katas/KATA-000028
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go build -o /tmp/ninja-lift ./cmd/lift
          python3 tests/differential.py /tmp/ninja-lift
          if go test -tags kata_red ./... > /tmp/ninja-lift-red.log 2>&1; then echo 'Expected RED passed' >&2; exit 1; fi
          grep -q 'unexpected trace' /tmp/ninja-lift-red.log
