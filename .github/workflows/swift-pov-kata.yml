name: Swift POV kata
on:
  pull_request:
    branches: [dev, main]
    paths: ['katas/KATA-000053/**', '.github/workflows/swift-pov-kata.yml', 'catalog/**']
  push:
    branches: [dev, main]
    paths: ['katas/KATA-000053/**', '.github/workflows/swift-pov-kata.yml']
permissions:
  contents: read
jobs:
  pov:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: Genuine Swift RED GREEN and independent Go BFS oracle
        working-directory: katas/KATA-000053
        shell: bash
        run: |
          set -euo pipefail
          swiftc --version
          go version
          bash tests/run.sh
