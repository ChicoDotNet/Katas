name: Java Satellite tree kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000054/**'
      - '.github/workflows/java-satellite-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000054/**'
      - '.github/workflows/java-satellite-kata.yml'
permissions:
  contents: read
jobs:
  satellite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: GREEN RED and independent generator-first oracle
        working-directory: katas/KATA-000054
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/satellite
          javac --release 21 -Xlint:all -Werror -d /tmp/satellite src/*.java tests/TestSatellite.java
          java -cp /tmp/satellite TestSatellite
          python3 tests/differential.py /tmp/satellite
          if KATA_RED=1 java -cp /tmp/satellite TestSatellite >/tmp/satellite-red.log 2>&1; then exit 1; fi
          grep -q 'FAIL behavioral tree mismatch' /tmp/satellite-red.log
