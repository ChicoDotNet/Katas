name: TypeScript Forth kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000033/**'
      - '.github/workflows/typescript-forth-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000033/**'
      - '.github/workflows/typescript-forth-katas.yml'
permissions:
  contents: read
jobs:
  forth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript (no package scripts)
        working-directory: katas/KATA-000033
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Behavioral RED GREEN and independent Python oracle
        working-directory: katas/KATA-000033
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p tsconfig.json
          node build/tests/test_forth.js
          python3 tests/differential.py
          mkdir -p /tmp/forth-red/src /tmp/forth-red/tests
          cp tests/forth_red.ts /tmp/forth-red/src/forth.ts
          cp tests/test_forth.ts /tmp/forth-red/tests/test_forth.ts
          ./node_modules/.bin/tsc --strict --target ES2022 --module commonjs --lib ES2022,DOM --outDir /tmp/forth-red/build /tmp/forth-red/src/forth.ts /tmp/forth-red/tests/test_forth.ts
          if node /tmp/forth-red/build/tests/test_forth.js > /tmp/forth-red.log 2>&1; then
            echo 'Expected behavioral RED unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'ASSERT behavior' /tmp/forth-red.log
