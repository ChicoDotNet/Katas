name: PHP VLQ kata
on:
  pull_request:
    branches: [dev, main]
    paths: ['katas/KATA-000047/**', '.github/workflows/php-vlq-kata.yml', 'catalog/**']
  push:
    branches: [dev, main]
    paths: ['katas/KATA-000047/**', '.github/workflows/php-vlq-kata.yml']
permissions:
  contents: read
jobs:
  vlq:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Behavioral RED, GREEN and independent Python oracle
        working-directory: katas/KATA-000047
        shell: bash
        run: |
          set -euo pipefail
          php -l src/VLQ.php
          php tests/test_vlq.php
          if KATA_RED=1 php tests/test_vlq.php > /tmp/vlq-red.log 2>&1; then echo 'Expected RED passed' >&2; exit 1; fi
          grep -q 'FAIL behavioral assertion' /tmp/vlq-red.log
          python3 tests/differential.py src/cli.php
