name: Go Parallel Letter Frequency kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000057/**'
      - '.github/workflows/go-parallel-frequency-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000057/**'
      - '.github/workflows/go-parallel-frequency-kata.yml'
permissions:
  contents: read
jobs:
  parallel-frequency:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: RED GREEN race detector and sequential Python oracle
        working-directory: katas/KATA-000057
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./...
          go build -o /tmp/frequency-cli ./cmd/frequency
          python3 tests/differential.py /tmp/frequency-cli
          if KATA_RED=1 go test ./... >/tmp/frequency-red.log 2>&1; then echo 'RED unexpectedly passed' >&2; exit 1; fi
          grep -q 'FAIL behavioral assertion' /tmp/frequency-red.log
