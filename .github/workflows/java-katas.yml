name: Java kata characterization and refactor
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000001/**'
      - '.github/workflows/java-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000001/**'
      - '.github/workflows/java-katas.yml'
permissions:
  contents: read
jobs:
  ugly-trivia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile independent RED and GREEN variants
        shell: bash
        working-directory: katas/KATA-000001
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivia-red /tmp/trivia-green
          javac --release 21 -d /tmp/trivia-red src/TriviaCli.java src/TriviaLegacy.java tests/RedStub.java tests/TestTrivia.java
          if java -cp /tmp/trivia-red TestTrivia > /tmp/trivia-red.log 2>&1; then
            echo 'RED passed unexpectedly' >&2
            exit 1
          fi
          grep -q 'refactored behavioral golden master mismatch' /tmp/trivia-red.log
          javac --release 21 -d /tmp/trivia-green src/*.java tests/TestTrivia.java
          java -cp /tmp/trivia-green TestTrivia
      - name: Independent differential verification and invalid inputs
        working-directory: katas/KATA-000001
        run: python3 tests/differential.py /tmp/trivia-green
      - name: Event-stream trace contract, metamorphisms and compiled mutants
        shell: bash
        run: bash katas/KATA-000001/tests/run_trace_hardening.sh
