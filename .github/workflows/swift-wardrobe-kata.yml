name: Swift Wardrobe DP + Go brute-force oracle
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000014/**'
      - '.github/workflows/swift-wardrobe-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000014/**'
      - '.github/workflows/swift-wardrobe-kata.yml'
permissions:
  contents: read
jobs:
  wardrobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: Native Swift RED GREEN, Go brute-force oracle, metamorphisms and compiled mutations
        working-directory: katas/KATA-000014
        shell: bash
        run: |
          set -euo pipefail
          swiftc --version
          go version
          python3 --version
          bash tests/run.sh
