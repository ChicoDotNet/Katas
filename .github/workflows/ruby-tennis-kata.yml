name: Ruby Tennis FSM + Go prefix oracle
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000027/**'
      - '.github/workflows/ruby-tennis-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000027/**'
      - '.github/workflows/ruby-tennis-kata.yml'
permissions:
  contents: read
jobs:
  tennis:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Native RED GREEN, independent Go oracle, metamorphism, mutation
        run: bash katas/KATA-000027/run.sh
