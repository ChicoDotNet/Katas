name: Java Parallel Change kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000019/**'
      - '.github/workflows/java-parallel-change.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000019/**'
      - '.github/workflows/java-parallel-change.yml'
permissions:
  contents: read
jobs:
  cart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Expand-contract GREEN, oracle and isolated RED
        working-directory: katas/KATA-000019
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cart-green /tmp/cart-red
          javac --release 21 -d /tmp/cart-green src/*.java tests/TestShoppingCart.java
          java -cp /tmp/cart-green TestShoppingCart
          python3 tests/differential.py /tmp/cart-green
          javac --release 21 -d /tmp/cart-red tests/RedCart.java tests/TestShoppingCart.java
          if java -cp /tmp/cart-red TestShoppingCart > /tmp/cart-red.log 2>&1; then echo 'Expected RED passed' >&2; exit 1; fi
          grep -q 'bulk items retained' /tmp/cart-red.log
