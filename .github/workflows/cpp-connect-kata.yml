name: C++ Connect Hex kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000048/**'
      - '.github/workflows/cpp-connect-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000048/**'
      - '.github/workflows/cpp-connect-kata.yml'
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Strict C++20 RED GREEN and independent Python DSU oracle
        working-directory: katas/KATA-000048
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic src/connect.cpp tests/test_connect.cpp -o /tmp/hex-test
          /tmp/hex-test
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic src/connect.cpp src/main.cpp -o /tmp/hex-cli
          python3 tests/differential.py /tmp/hex-cli
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -DKATA_RED src/connect.cpp tests/test_connect.cpp -o /tmp/hex-red
          ulimit -c 0
          if /tmp/hex-red >/tmp/hex-red.log 2>&1; then echo 'RED unexpectedly passed' >&2; exit 1; fi
          grep -q 'Assertion' /tmp/hex-red.log
