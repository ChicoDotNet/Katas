name: C bowling kata
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000009/**'
      - '.github/workflows/c-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000009/**'
      - '.github/workflows/c-katas.yml'
permissions:
  contents: read
jobs:
  bowling:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: RED GREEN and Python oracle
        working-directory: katas/KATA-000009
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/bowling.c tests/test.c -o /tmp/bowl-test
          /tmp/bowl-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic src/bowling.c src/main.c -o /tmp/bowl-cli
          python3 tests/differential.py /tmp/bowl-cli
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/red_stub.c tests/test.c -o /tmp/bowl-red
          ulimit -c 0
          if /tmp/bowl-red > /tmp/bowl-red.log 2>&1; then echo 'Expected RED passed' >&2; exit 1; fi
          grep -q 'Assertion' /tmp/bowl-red.log
