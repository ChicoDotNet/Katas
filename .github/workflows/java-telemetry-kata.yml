name: Java Telemetry Kata — native contracts and independent grammar
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000020/**'
      - '.github/workflows/java-telemetry-kata.yml'
  push:
    branches: [dev, main, 'kata/000020-*']
    paths:
      - 'katas/KATA-000020/**'
      - '.github/workflows/java-telemetry-kata.yml'
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile RED, assert behavioral failure, run GREEN and independent grammar oracle
        run: bash katas/KATA-000020/tests/run.sh
