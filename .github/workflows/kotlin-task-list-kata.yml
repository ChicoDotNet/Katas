name: Kotlin Task List + Go event-replay oracle
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000026/**'
      - '.github/workflows/kotlin-task-list-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000026/**'
      - '.github/workflows/kotlin-task-list-kata.yml'
permissions:
  contents: read
jobs:
  task-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: Install pinned Kotlin 1.9 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin 1.9.0
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"
      - name: RED GREEN independent oracle and compiled mutations
        working-directory: katas/KATA-000026
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -version
          go version
          bash tests/run.sh
