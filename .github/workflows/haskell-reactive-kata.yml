name: Haskell pure DAG model for JavaScript Reactive Cells
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000037/**'
      - '.github/workflows/haskell-reactive-kata.yml'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000037/**'
      - '.github/workflows/haskell-reactive-kata.yml'
permissions:
  contents: read
jobs:
  haskell-reactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-update: false
      - name: Compile pure Haskell model
        run: ghc -O1 -Wall -outputdir /tmp -o /tmp/ninja-react-haskell katas/KATA-000037/tests/reactive_haskell.hs
      - name: Verify stable-state callback snapshots
        run: node katas/KATA-000037/tests/haskell_crosscheck.mjs /tmp/ninja-react-haskell katas/KATA-000037/src/cli.mjs
