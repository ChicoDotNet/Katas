name: PHP kata verification
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000002/**'
      - '.github/workflows/php-katas.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000002/**'
      - '.github/workflows/php-katas.yml'
permissions:
  contents: read
jobs:
  banking-kata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP / Python versions
        run: |
          php -v
          python3 --version
      - name: Verify RED fails for required behavior, then GREEN
        working-directory: katas/KATA-000002
        shell: bash
        run: |
          set -euo pipefail
          if KATA_RED=1 php tests/behavior.php >/tmp/banking-red.txt 2>&1; then
            echo 'Expected RED unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'FAIL: outside-in ledger interactions' /tmp/banking-red.txt
          php -l src/Bank.php
          php -l src/cli.php
          php tests/behavior.php
          python3 tests/differential.py
