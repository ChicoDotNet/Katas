name: Kata catalog validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate catalog
        run: python3 tools/kata_lab.py validate
      - name: Print experiment report
        run: python3 tools/kata_lab.py report
