name: Java Tic Tac Toe + Go BFS oracle
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000029/**'
      - '.github/workflows/java-tic-tac-toe-kata.yml'
      - 'catalog/**'
  push:
    branches: [dev, main]
    paths:
      - 'katas/KATA-000029/**'
      - '.github/workflows/java-tic-tac-toe-kata.yml'
permissions:
  contents: read
jobs:
  exhaustive-board-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: RED, GREEN, exhaustive independent BFS, symmetry and mutation
        shell: bash
        run: bash katas/KATA-000029/tests/run.sh
